<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамический список задач</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 2.2rem;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #task-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        #task-input:focus {
            border-color: #3498db;
            outline: none;
        }
        
        #add-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        #add-btn:hover {
            background-color: #27ae60;
        }
        
        #task-list {
            list-style-type: none;
            margin-top: 20px;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: fadeIn 0.5s;
            border-left: 4px solid #3498db;
        }
        
        .task-item.completed {
            border-left-color: #2ecc71;
        }
        
        .task-text {
            flex: 1;
            margin: 0 15px;
            word-break: break-word;
        }
        
        .completed .task-text {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        
        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .delete-btn:hover {
            background-color: #c0392b;
        }
        
        .empty-state {
            text-align: center;
            color: #7f8c8d;
            margin-top: 30px;
            font-style: italic;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
            }
            
            #add-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мой список задач</h1>
        
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Введите новую задачу...">
            <button id="add-btn">Добавить</button>
        </div>
        
        <ul id="task-list">
            <li class="empty-state">Список задач пуст. Добавьте первую задачу!</li>
        </ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Элементы DOM
            const taskInput = document.getElementById('task-input');
            const addButton = document.getElementById('add-btn');
            const taskList = document.getElementById('task-list');
            const emptyState = document.querySelector('.empty-state');
            
            // Обработчик добавления новой задачи
            addButton.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            // Функция добавления задачи
            function addTask() {
                const taskText = taskInput.value.trim();
                
                if (taskText === '') {
                    alert('Пожалуйста, введите текст задачи!');
                    taskInput.focus();
                    return;
                }
                
                // Скрываем сообщение о пустом списке
                if (emptyState) {
                    emptyState.style.display = 'none';
                }
                
                // Создаем элемент задачи
                const taskItem = document.createElement('li');
                taskItem.className = 'task-item';
                
                // Чекбокс для отметки выполнения
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';
                checkbox.addEventListener('change', function() {
                    // При отметке добавляем/убираем класс completed
                    taskItem.classList.toggle('completed', checkbox.checked);
                });
                
                // Текст задачи
                const taskSpan = document.createElement('span');
                taskSpan.className = 'task-text';
                taskSpan.textContent = taskText;
                
                // Кнопка удаления
                const deleteButton = document.createElement('button');
                deleteButton.className = 'delete-btn';
                deleteButton.textContent = 'Удалить';
                deleteButton.addEventListener('click', function() {
                    // Удаляем задачу и проверяем, не опустел ли список
                    taskItem.remove();
                    checkEmptyList();
                });
                
                // Добавляем элементы в задачу
                taskItem.appendChild(checkbox);
                taskItem.appendChild(taskSpan);
                taskItem.appendChild(deleteButton);
                
                // Добавляем задачу в список
                taskList.appendChild(taskItem);
                
                // Очищаем поле ввода и фокусируемся на нем
                taskInput.value = '';
                taskInput.focus();
            }
            
            // Проверка пустого списка
            function checkEmptyList() {
                if (taskList.children.length === 0) {
                    if (!emptyState) {
                        const emptyMsg = document.createElement('li');
                        emptyMsg.className = 'empty-state';
                        emptyMsg.textContent = 'Список задач пуст. Добавьте первую задачу!';
                        taskList.appendChild(emptyMsg);
                    } else {
                        emptyState.style.display = 'block';
                    }
                }
            }
        });
    </script>
</body>
</html>
